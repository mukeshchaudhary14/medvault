name: MedVault CI/CD Production Pipeline

# ==============================================================================
# Pipeline Overview:
# 1. Code Quality & Test: Validates TypeScript compilation, linting, & app build
# 2. Docker Build & Push: Builds optimized container & pushes to Docker Hub (makug/medvault)
# 3. Security Scan: Scans Docker image for security vulnerabilities using Trivy
# 4. Deployment Trigger: Pulls directly from Docker Hub to deploy without source code
# ==============================================================================

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Cancel any previous runs on the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: makug/medvault
  NODE_VERSION: "22"

jobs:
  # ============================================================================
  # STAGE 1: Code Quality, Lint & Build Verification
  # ============================================================================
  code-quality:
    name: 🧪 Quality Check & Build Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 🔍 Linting Check
        run: npm run lint || true

      - name: 🏗️ Verify TypeScript & Production Build
        run: npm run build

  # ============================================================================
  # STAGE 2: Build & Push Docker Image to Docker Hub
  # ============================================================================
  docker-build-push:
    name: 🐳 Docker Build & Push to Docker Hub
    needs: [code-quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔀 Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'makug' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Generate Docker Metadata & Smart Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: 🚀 Build and Push Docker Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📋 Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🚀 Docker Image Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Repository**: [${{ env.DOCKER_IMAGE }}](https://hub.docker.com/r/${{ env.DOCKER_IMAGE }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags Generated**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # STAGE 3: Security & Vulnerability Scan (Trivy)
  # ============================================================================
  security-scan:
    name: 🛡️ Container Vulnerability Scan
    needs: [docker-build-push]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:latest
          format: 'table'
          exit-code: '0' # Don't fail build, just report warnings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # STAGE 4: Automated Deployment (Pull Directly from Docker Hub)
  # ============================================================================
  deploy:
    name: 🌐 Deploy (Pull Image from Docker Hub)
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Agar aapke paas VPS / Cloud server hai toh SSH secrets enable karein
    steps:
      - name: 📡 Deployment Notification
        run: |
          echo "Image 'makug/medvault:latest' is ready on Docker Hub."
          echo "Server can now execute: docker pull makug/medvault:latest && docker compose -f docker-compose.prod.yml up -d"
