<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" style="background: #090d16; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="dockerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <!-- CSS Keyframe Animations (Strictly properties that don't alter positioning) -->
    <style>
      @keyframes dashFlow {
        to { stroke-dashoffset: -32; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .anim-flow {
        stroke-dasharray: 8, 8;
        animation: dashFlow 1.2s linear infinite;
      }
      .pulse-tag {
        animation: pulseGlow 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(30, 24)">
    <circle cx="8" cy="8" r="5" fill="#10b981" />
    <text x="22" y="13" fill="#f8fafc" font-size="13" font-weight="bold" letter-spacing="0.5">MEDVAULT — END-TO-END DEVOPS &amp; GITOPS PIPELINE</text>
    <rect x="800" y="0" width="130" height="20" rx="10" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="865" y="14" fill="#38bdf8" font-size="10.5" font-weight="bold" font-family="monospace" text-anchor="middle">AUTO-SYNC: ACTIVE</text>
  </g>
  <line x1="30" y1="46" x2="970" y2="46" stroke="#1e293b" stroke-width="1.5" />

  <!-- ================= Animated Connecting Streams ================= -->
  <!-- 1. Dev -> GitHub -->
  <path d="M 130 155 L 195 155" stroke="#38bdf8" stroke-width="3" fill="none" class="anim-flow" />
  
  <!-- 2. GitHub -> Jenkins -->
  <path d="M 290 155 L 355 155" stroke="#c084fc" stroke-width="3" fill="none" class="anim-flow" />
  
  <!-- 3. Jenkins -> Docker Hub -->
  <path d="M 455 155 L 510 155" stroke="#fb923c" stroke-width="3" fill="none" class="anim-flow" />
  
  <!-- 4. Docker Hub -> Kubernetes / ArgoCD -->
  <path d="M 630 155 L 685 155" stroke="#38bdf8" stroke-width="3" fill="none" class="anim-flow" />

  <!-- 5. K8s -> Users -->
  <path d="M 810 155 L 865 155" stroke="#34d399" stroke-width="3" fill="none" class="anim-flow" />

  <!-- 6. GitOps Watch Curve (GitHub -> ArgoCD) -->
  <path d="M 242 205 C 242 280, 747 280, 747 205" stroke="#10b981" stroke-width="2.5" fill="none" class="anim-flow" stroke-dasharray="6,6" opacity="0.8" />
  <rect x="420" y="260" width="150" height="18" rx="9" fill="#022c22" stroke="#059669" stroke-width="1"/>
  <text x="495" y="273" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle" font-family="monospace">GitOps Watch (helm/)</text>


  <!-- ================= PIPELINE NODES ================= -->

  <!-- NODE 1: Developer -->
  <g transform="translate(40, 100)">
    <rect width="90" height="110" rx="12" fill="#0f172a" stroke="#1e3a8a" stroke-width="2"/>
    <text x="45" y="44" font-size="28" text-anchor="middle">👨‍💻</text>
    <text x="45" y="70" fill="#e2e8f0" font-size="11.5" font-weight="bold" text-anchor="middle">Developer</text>
    <rect x="14" y="80" width="62" height="18" rx="4" fill="#1e293b" />
    <text x="45" y="93" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">git push</text>
  </g>

  <!-- NODE 2: GitHub -->
  <g transform="translate(195, 100)">
    <rect width="95" height="110" rx="12" fill="#1e1035" stroke="#7e22ce" stroke-width="2"/>
    <text x="47.5" y="44" font-size="28" text-anchor="middle">🐙</text>
    <text x="47.5" y="70" fill="#e2e8f0" font-size="11.5" font-weight="bold" text-anchor="middle">GitHub</text>
    <rect x="10" y="80" width="75" height="18" rx="4" fill="#2e1065" />
    <text x="47.5" y="93" fill="#c084fc" font-size="9" font-family="monospace" text-anchor="middle">main branch</text>
  </g>

  <!-- NODE 3: Jenkins CI + Trivy -->
  <g transform="translate(355, 100)">
    <rect width="100" height="110" rx="12" fill="#2d1502" stroke="#ea580c" stroke-width="2"/>
    <text x="50" y="44" font-size="26" text-anchor="middle">⚙️</text>
    <text x="50" y="70" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">Jenkins CI</text>
    <rect x="10" y="79" width="80" height="20" rx="4" fill="#431407" />
    <text x="50" y="93" fill="#fb923c" font-size="8.5" font-family="monospace" font-weight="bold" text-anchor="middle">🛡️ Trivy Scan</text>
  </g>

  <!-- NODE 4: DOCKER HUB REGISTRY (Eraser.io Cylinder Design) -->
  <g transform="translate(510, 90)">
    <!-- Cylinder Lower Body -->
    <path d="M 5 28 L 5 102 A 55 16 0 0 0 115 102 L 115 28 Z" fill="url(#dockerBody)" stroke="#38bdf8" stroke-width="2.5" />
    
    <!-- Cylinder Bottom Ellipse -->
    <ellipse cx="60" cy="102" rx="55" ry="16" fill="#082f49" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Cylinder Top Cap Ellipse -->
    <ellipse cx="60" cy="28" rx="55" ry="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Content Inside Cylinder -->
    <text x="60" y="58" font-size="18" text-anchor="middle">🐳</text>
    <text x="60" y="75" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">Docker Hub</text>
    <text x="60" y="89" fill="#7dd3fc" font-size="8" font-family="monospace" text-anchor="middle">makug/medvault</text>
    
    <!-- Glowing Badge (:latest) -->
    <g class="pulse-tag">
      <rect x="34" y="95" width="52" height="17" rx="4" fill="#38bdf8" />
      <text x="60" y="107" fill="#082f49" font-size="8.5" font-family="monospace" font-weight="bold" text-anchor="middle">:latest</text>
    </g>
  </g>

  <!-- NODE 5: ArgoCD & Kubernetes -->
  <g transform="translate(685, 95)">
    <rect width="125" height="118" rx="14" fill="#062e24" stroke="#10b981" stroke-width="2.5"/>
    <text x="62.5" y="40" font-size="24" text-anchor="middle">🐙☸️</text>
    <text x="62.5" y="62" fill="#e2e8f0" font-size="11.5" font-weight="bold" text-anchor="middle">ArgoCD + K8s</text>
    <text x="62.5" y="76" fill="#34d399" font-size="9" font-weight="600" text-anchor="middle">2 Pods (Nginx SPA)</text>
    <rect x="15" y="85" width="95" height="19" rx="4" fill="#022c22" stroke="#059669" stroke-width="1"/>
    <text x="62.5" y="98" fill="#6ee7b7" font-size="8.5" font-family="monospace" text-anchor="middle">NodePort: 30080</text>
  </g>

  <!-- NODE 6: End Users -->
  <g transform="translate(865, 100)">
    <rect width="90" height="110" rx="12" fill="#0c2340" stroke="#0284c7" stroke-width="2"/>
    <text x="45" y="44" font-size="26" text-anchor="middle">👥</text>
    <text x="45" y="70" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">End Users</text>
    <rect x="12" y="80" width="66" height="18" rx="4" fill="#082f49" />
    <text x="45" y="93" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="middle">Live SaaS</text>
  </g>

</svg>
